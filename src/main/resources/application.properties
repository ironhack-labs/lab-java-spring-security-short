spring.application.name=blog-cms

# Local development only: listen on loopback. Override with SERVER_ADDRESS when deploying.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=8080

# In-memory H2 database, recreated on every start and seeded by DataSeeder.
spring.datasource.url=jdbc:h2:mem:blogcms;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Accounts. Passwords are read from the environment; if unset, a random one is generated and logged.
blog.security.admin.username=${BLOG_ADMIN_USERNAME:admin}
blog.security.admin.password=${BLOG_ADMIN_PASSWORD:}
blog.security.reader.username=${BLOG_READER_USERNAME:reader}
blog.security.reader.password=${BLOG_READER_PASSWORD:}
